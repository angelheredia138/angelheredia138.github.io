name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -- --output-path=dist --base-href /

      - name: Deploy to GitHub Pages
        run: |
          npx angular-cli-ghpages --dir=dist/browser --cname=angel-heredia.com --no-silent
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
